<script type="application/json" id="_d">{"architecture":"# RoninNetease 架构设计\r\n\r\n## 为什么存在这个框架\r\n\r\n网易基岩版《我的世界》模组 SDK（`mod.client.extraClientApi` / `mod.server.extraServerApi`）提供了一个底层的事件驱动的 API，但没有提供任何业务逻辑组织方式。\r\n\r\n典型原始开发的代码结构：\r\n\r\n```python\r\n# 所有逻辑平铺在 listen/import 回调中\r\ndef on_tick():\r\n    for entityId in global_entity_list:\r\n        comp = api.CreateComponent(entityId, 'xxx', 'Health')\r\n        if comp and comp.value <= 0:\r\n            api.DestroyEntity(entityId)\r\n```\r\n\r\n随着模组规模增长（实体类型增多、子系统间依赖复杂），这种模式迅速退化为**面条式代码**——状态散落在全局字典中、生命周期失控、实体遍历每次都全量扫描 O(n)、子系统间硬引用耦合。\r\n\r\nRoninNetease 的目标是将这些痛点一一解决，同时保持 Python 2 兼容性。\r\n\r\n## 分层设计\r\n\r\n```\r\n┌──────────────────────────────────────────────────────────┐\r\n│                 compact.py  (统一入口)                     │\r\n├──────────────────────────────────────────────────────────┤\r\n│  UI Layer      │  FSM       │  Remote (RPC)               │\r\n│  Signal/Sink   │  StateTree │  DataTable serialization    │\r\n├──────────────────────────────────────────────────────────┤\r\n│  Query Layer   │  Event Layer                             │\r\n│  @Query        │  EventChain / EventSignal / EventTarget │\r\n│  CompIndex     │  @EventListener / ChainedEvent           │\r\n├──────────────────────────────────────────────────────────┤\r\n│  Component Layer │  Scheduler Layer                       │\r\n│  CRUD / Marker   │  Tick / Render / Fixed / Event        │\r\n│  Schema / Persist│  Future / Async                        │\r\n├──────────────────────────────────────────────────────────┤\r\n│  SubsystemManager  │  Plugin Loader  │  CommandBus         │\r\n│  Lifecycle / Tick  │  Dep Topology   │  Subsystem decouple │\r\n├──────────────────────────────────────────────────────────┤\r\n│  Annotation System │  Profiler  │  Config (HOT_RELOADABLE) │\r\n├──────────────────────────────────────────────────────────┤\r\n│  NetEase SDK (mod.client.extraClientApi / mod.server)     │\r\n└──────────────────────────────────────────────────────────┘\r\n```\r\n\r\n## 核心设计决策\r\n\r\n### 1. 装饰器驱动 vs 显式注册\r\n\r\n**选择**：装饰器驱动。\r\n\r\n```python\r\n# 框架方式\r\n@Sched.Tick()\r\n@Query(EntityId, HealthComponent)\r\ndef handle(self, entityId, health):\r\n    ...\r\n\r\n# 对比显式注册方式\r\nmanager.tickScheduler.register('update', lambda dt: handle(dt))\r\nmanager.queryEngine.register(HealthComponent, handle)\r\n```\r\n\r\n**原因**：\r\n- 网易模组开发者的主力 IDE（PyCharm + MC Dev Kit）对装饰器的代码补全和跳转支持良好\r\n- 声明式代码在阅读时比注册式代码更容易理解「这个方法在何时被调用」\r\n- `@Query` 的参数在装饰时就能做静态检查（组件是否存在）\r\n\r\n**代价**：隐式行为增多，调用栈中包含多层 wrapper，调试时需理解注解系统的工作原理。\r\n\r\n### 2. CompIndex 反向索引 vs Archetype\r\n\r\n**选择**：组件名 → 实体 ID 集合的反向索引，Query 时求交集。\r\n\r\n**原因**：\r\n- 网易 SDK 的组件存储在 C++ 引擎侧，框架只能通过字符串名称创建/销毁组件，无法在 Python 侧控制组件的内存布局（Archetype 的前提不成立）\r\n- 集合交集 O(min(m,n)) 的性能在实际模组中（通常实体持有 5-15 个组件）远优于全量遍历 O(n)\r\n- 按集合大小升序排列后逐级裁剪，充分利用了「稀有组件」的过滤效果\r\n\r\n### 3. SubsystemManager + subsystem 双接口\r\n\r\n**选择**：`SubsystemManager`（实例）负责生命周期管理，`subsystem`（静态类）提供快捷访问。\r\n\r\n**原因**：\r\n- 大部分模组只有一个主导子系统（Server 端一个，Client 端一个），`subsystem.sendServer()` 比 `SubsystemManager.getInstance().getSubsystem(MySystem).sendServer()` 简洁得多\r\n- 当需要多子系统协作时，`SubsystemManager.getSubsystem()` 提供精确控制\r\n- `subsystem` 类代理第一个注册的子系统，这是一个「80% 场景的便捷层」\r\n\r\n### 4. 调度器重入保护\r\n\r\n**选择**：跳过而非排队。\r\n\r\n```python\r\nif self._sequenceExecuting:\r\n    self._skippedUpdates += 1\r\n    return  # 直接跳过\r\n```\r\n\r\n**原因**：\r\n- 网易 SDK 的 Tick 回调是单线程同步调用，不存在真正并发的重入\r\n- 跳过而非排队的理由是：如果上一次 `executeSequence` 还未完成，说明某任务耗时超过了一个 Tick 周期。此时排队会导致任务堆积并延迟越来越大，跳过反而是止损\r\n- 跳过的帧数通过 `getSkippedUpdates()` 暴露给 Profiler，开发者可以从诊断快照中感知到性能瓶颈\r\n\r\n### 5. Python 2 兼容性策略\r\n\r\n**选择**：`# type:` 注释 + `if 1 > 2` hack。\r\n\r\n**原因**：\r\n- Python 2 没有 PEP 484 类型注解语法\r\n- `# type:` 是 PyCharm/VS Code 等 IDE 支持的非标准类型标注方式\r\n- `if 1 > 2: return cls()` 利用死代码分支让类型检查器推断返回值类型为 `cls`，否则返回 `None` 会导致所有调用处报类型警告\r\n- 这些代码在有类型注解的 Python 3 中是冗余的，但在 Py2 + IDE 类型检查的组合中是不可或缺的\r\n\r\n## 数据流\r\n\r\n```\r\n游戏引擎 Tick / Render 事件\r\n        │\r\n        ▼\r\n  SubsystemManager.tickSubsystem()\r\n        │\r\n        ├─► 遍历 subsystems, 调用 onUpdate(dt)\r\n        │       │\r\n        │       └─► Profiler.record('XxxSystem.onUpdate')\r\n        │\r\n        └─► tickSched.executeSequence()\r\n                │\r\n                ├─► TimerTask 队列\r\n                ├─► BeforeUpdate 队列\r\n                ├─► Update 队列       ← @Sched.Tick() 方法在此执行\r\n                │       │\r\n                │       └─► @Query 装饰器\r\n                │               │\r\n                │               └─► CompIndex.queryEntities()\r\n                │                       │\r\n                │                       └─► 集合交集 → 候选 entityId 列表\r\n                │                               │\r\n                │                               └─► getComponentWithQuery()\r\n                │                                       │\r\n                │                                       └─► 检查 required/excluded\r\n                │                                               │\r\n                │                                               └─► 注入参数, 调用 fn()\r\n                │\r\n                └─► AfterUpdate 队列\r\n\r\nProfiler.flush() → {\r\n    'HealthSystem.onUpdate': {'avg_ms': 1.2, 'max_ms': 3.4, 'count': 60},\r\n    'scheduler.tickSkipped': {'avg_ms': 0.0, 'max_ms': 0.0, 'count': 60},\r\n}\r\n```\r\n\r\n## 模块职责矩阵\r\n\r\n| 模块 | 职责 | 依赖 |\r\n|------|------|------|\r\n| `core/subsystem.py` | 生命周期管理、Tick 驱动 | event, scheduler, component, remote |\r\n| `core/scheduler.py` | 四类调度执行 | basic, conf |\r\n| `core/loader.py` | 插件发现/依赖排序/加载 | subsystem, configurator |\r\n| `core/bus.py` | 子系统间同步通信 | 无 |\r\n| `core/profiler.py` | 性能诊断 | 无 |\r\n| `core/configurator.py` | 配置读取 + 热更新 | basic |\r\n| `component/core.py` | ECS CRUD + CompIndex | annotation, event, schema |\r\n| `component/schema.py` | 组件字段声明与验证 | 无 |\r\n| `query/common.py` | @Query 注入 + CompIndex 查询 | component |\r\n| `event/core.py` | EventSignal, EventChain, ChainedEvent | unreliable |\r\n| `remote/common.py` | 跨端 RPC + Future | scheduler, subsystem |\r\n| `ui/client.py` | 响应式 UI (Signal/Sink) | event, subsystem |","ecs":"# 组件系统 (ECS)\n\n## 概念\n\nRoninNetease 的 ECS 基于网易 SDK 的 `RegisterComponent`/`CreateComponent` 机制。框架额外提供了：\n\n- **声明式组件定义** — `@Component` 装饰器\n- **字段 Schema 与验证** — `@DefineFields` + `FieldSchema`\n- **实体生命周期事件** — `Marker.onEntityCreated` / `onEntityDestroyed`\n- **高效查询** — CompIndex 反向索引，`@Query` 自动注入\n\n---\n\n## 组件基类\n\n```python\nfrom architect.component import BaseCompServer, BaseCompClient\n\n@Component()\nclass HealthComponent(BaseCompServer):\n\n    def onCreate(self, entityId):\n        \"组件首次创建时调用。\"\n        self.value = 100\n\n    def onDestroy(self, entityId):\n        \"组件被移除时调用。\"\n        pass\n\n    def loadData(self, entityId):\n        \"仅持久化组件：从数据库加载后调用。\"\n        pass\n```\n\n---\n\n## 字段 Schema — v1.1.0\n\n`@DefineFields` 声明组件的期望字段、默认值和验证规则。框架在 `createComponent` 时自动初始化。\n\n```python\nfrom architect.component.schema import FieldSchema, DefineFields\n\n@Component()\n@DefineFields(\n    health=FieldSchema(default=100, validator=lambda v: 0 <= v <= 1000),\n    name=FieldSchema(default='unnamed'),\n    tags=FieldSchema(default=[], validator=lambda v: isinstance(v, list) and len(v) <= 10),\n)\nclass CharacterComponent(BaseCompServer):\n    def onCreate(self, entityId):\n        # 此时 health=100, name='unnamed', tags=[] 已自动设置\n        self.level = 1\n```\n\n验证失败会抛出 `ValueError`：\n\n```python\ncomp.health = 2000  # ValueError: Validation failed\n```\n\n---\n\n## CRUD API\n\n```python\nfrom architect.component import createComponent, getOrCreateComponent, getOneComponent\nfrom architect.component import hasComponent, destroyComponent, createSingletonComponent\n\n# 创建（绑定到 entityId）\ncomp = createComponent(entityId, HealthComponent)\n\n# 不存在则创建\ncomp = getOrCreateComponent(entityId, HealthComponent)\n\n# 按实体验证是否拥有组件\nif hasComponent(entityId, HealthComponent):\n    comp = getOneComponent(entityId, HealthComponent)\n\n# 单例组件（绑定到 levelId，全局唯一）\nsingleton = createSingletonComponent(GlobalDataComponent)\n\n# 销毁\ndestroyComponent(entityId, HealthComponent)\n```\n\n---\n\n## 实体生命周期事件 — v1.1.0\n\n当实体首次获得组件或最后一个组件被移除时触发。\n\n```python\nfrom architect.component.core import _getEntityMarker\n\nclass CacheSystem(ServerSubsystem):\n\n    def onInit(self):\n        # 注册清理回调 — 实体销毁时自动清理缓存\n        _getEntityMarker().onEntityDestroyed.on(self._on_entity_gone)\n        self.cache = {}\n\n    def _on_entity_gone(self, entityId):\n        self.cache.pop(entityId, None)\n```\n\n---\n\n## `@Query` — 自动遍历与注入\n\n```python\nfrom architect.compact import Sched, Query, EntityId\n\nclass HealthSystem(ServerSubsystem):\n\n    @Sched.Tick()\n    @Query(HealthComponent, EntityId)\n    def tick_health(self, entityId, health):\n        \"框架自动：1) CompIndex 筛选实体 2) 注入 health/entityId 3) 调用此方法\"\n        if health.health <= 0:\n            self.destroyEntity(entityId)\n```\n\n### required / excluded 过滤\n\n```python\n# 只处理同时拥有 Health 和 CombatAI 的实体\n@Sched.Tick()\n@Query(HealthComponent, required=[CombatAI])\ndef tick_combat(self, health):\n    ...\n\n# 排除已经标记为死亡的实体\n@Sched.Tick()\n@Query(HealthComponent, excluded=[DeadComponent])\ndef tick_alive(self, health):\n    ...\n```\n\n### 额外参数注入\n\n```python\nfrom architect.compact import ExtraArguments, ExtraArgDict\n\n@Sched.Tick()\n@Query(HealthComponent, ExtraArguments, ExtraArgDict)\ndef process(self, health, args, kwargs):\n    \"args 和 kwargs 是外部传进来的位置/关键字参数元组/字典。\"\n```\n\n---\n\n## CompIndex 性能 — 为什么比全量遍历快\n\n`CompIndex` 维护「组件名 → 持有该组件的实体 ID 集合」的反向索引。\n\n```\n@Query(RareComponent, HealthComponent)\n→ sets = [{'e1', 'e3'}, {'e1', 'e2', 'e3', 'e5', 'e7'}]\n→ 按集合大小升序 → [{'e1', 'e3'}, {50k entities}]\n→ 交集: {'e1', 'e3'}  ← 只遍历 2 个实体\n```\n\n**最佳实践**: 查询中包含\"稀有组件\"作为第一个参数，让交集从最小的集合开始。\n\n---\n\n## 持久化组件\n\n```python\nfrom architect.component import PersistKeys\n\n@Component(persist=True)\n@PersistKeys('score', 'level', isGlobal=False)    # isGlobal=True → 跨存档全局数据库\nclass PlayerData(BaseCompServer):\n\n    def onCreate(self, entityId):\n        pass  # score/level 的 getter/setter 已被替换为 KV 数据库读写\n\n    def loadData(self, entityId):\n        print('Loaded:', self.score)\n```\n\n---\n\n## 重要注意事项\n\n- **始终通过框架 API 操作组件**（`createComponent`/`destroyComponent`）。直接调用网易 SDK 会导致 CompIndex 数据不一致\n- **组件只存数据**，不放逻辑。逻辑应放在子系统类中\n- `@Query` 必须配合 `@Sched.Tick()` 或 `@Sched.Render()` 使用\n- `canTick` 必须为 `True` 才能驱动 `onUpdate` 及其中的 `@Query` 方法","event":"# 事件系统\n\n## 概念\n\nRoninNetease 提供三层事件抽象：\n\n| 类型 | 用途 | 特性 |\n|------|------|------|\n| **EventSignal** | 简单观察者 | 一对多，按注册顺序同步执行 |\n| **EventChain** | 可中断事件链 | 捕获/冒泡阶段，`stop()` 终止传递 |\n| **ChainedEvent** | 事件对象 | 含 `stop()`/`prevent()`/`setEvent()` |\n\n---\n\n## EventSignal\n\n```python\nfrom architect.event.core import EventSignal\n\nsignal = EventSignal()\nhandler = lambda val: print('收到:', val)\nsignal.on(handler)\nsignal.emit(42)     # → 收到: 42\nsignal.off(handler)\n```\n\n---\n\n## EventChain\n\n```python\nfrom architect.event.core import EventChain\n\nchain = EventChain('MyEvent')\nchain.guarded = True      # 前一个处理器异常 → 后续跳过\nchain.useCapture = False  # False=冒泡（后注册先执行），True=捕获\n\n# 捕获处理器（先注册先执行）\nchain.capture(lambda ev: print('[Capture]', ev.dict()))\n# 冒泡处理器（后注册先执行，子→父）\nchain.addListener(lambda ev: print('[Bubble]', ev.dict()))\n\nchain.dispatch({'key': 'value'})\n```\n\n---\n\n## ChainedEvent\n\n```python\ndef listener(self, event):\n    # event 是 ChainedEvent 实例\n    event.stop()            # 终止链（后续处理器不执行）\n    event.prevent()         # 设置 cancel=True（引擎跳过默认行为）\n    event.setEvent('h', 1) # 修改事件数据\n    data = event.dict()     # 获取完整数据字典\n```\n\n---\n\n## `@EventListener` 装饰器\n\n```python\nfrom architect.compact import EventListener\n\nclass DamageSystem(ServerSubsystem):\n\n    @EventListener('EntityHurtEvent')\n    def on_hurt(self, event):\n        \"event 是 ChainedEvent。\"\n        if event.damage > 100:\n            event.prevent()\n\n    @EventListener('EntityDeathEvent')\n    def on_death(self, event):\n        print('实体死亡:', event.entityId)\n```\n\n---\n\n## 自定义事件 `@CustomEvent`\n\n```python\nfrom architect.compact import CustomEvent\n\nclass LevelSystem(ServerSubsystem):\n\n    @CustomEvent('PlayerLevelUp')\n    def on_level_up(self, event):\n        pid = event.playerId\n        lv = event.level\n        self.sendClient(pid, 'ShowLevelUp', {'level': lv})\n```\n\n---\n\n## 子系统内置事件方法\n\n子系统中也提供了便捷的事件注册/注销 API：\n\n```python\nclass MySystem(ServerSubsystem):\n\n    def onInit(self):\n        # 引擎事件（原生）\n        self.listen('EntityHurtEvent', self.on_hurt)\n        # 自定义事件\n        self.on('PlayerLevelUp', self.on_level_up)\n        # 广播自定义事件给所有监听者\n        self.broadcast('GameStarted', {'time': 0})\n\n    def onDestroy(self):\n        self.unlisten('EntityHurtEvent', self.on_hurt)\n        self.off('PlayerLevelUp', self.on_level_up)\n```\n\n---\n\n## 兼容性提示\n\n`ChainedEvent` 会自动处理引擎事件中的 `from` 字段：\n\n```python\nclass ChainedEvent:\n    def __init__(self, eventType, data={}, interruptRef=Ref(None)):\n        if 'from' in data:\n            data['source'] = data['from']  # 统一命名\n```","fsm":"# FSM 有限状态机\r\n\r\n`architect.fsm` 提供了有限状态机（Finite State Machine）实现，用于管理实体的状态切换。\r\n\r\n## FSM 类\r\n\r\n```python\r\nfrom architect.fsm import FSM\r\n```\r\n\r\n### 构造函数\r\n\r\n```python\r\nfsm = FSM(owner, initialState, states)\r\n```\r\n\r\n- **`owner`**: FSM 所属的对象（如子系统或实体）\r\n- **`initialState`**: 初始状态名称\r\n- **`states`**: 字典，key 为状态名，value 为状态配置\r\n\r\n### 状态配置\r\n\r\n每个状态可以定义 `accept` 和 `enter`/`exit` 回调：\r\n\r\n```python\r\nstates = {\r\n    'Idle': {\r\n        'accept': ['Patrol', 'Attack'],   # 可接受的事件名列表\r\n        'enter': lambda owner: print('Enter Idle'),\r\n        'exit': lambda owner: print('Exit Idle'),\r\n    },\r\n    'Patrol': {\r\n        'accept': ['Idle', 'Attack'],\r\n        'enter': on_enter_patrol,          # 函数引用\r\n    },\r\n    'Attack': {\r\n        'accept': ['Idle'],\r\n    },\r\n}\r\n\r\nfsm = FSM(entity, 'Idle', states)\r\n```\r\n\r\n### 核心方法\r\n\r\n```python\r\n# 发送事件给 FSM，触发状态切换\r\nfsm.accept(eventName, *args, **kwargs)\r\n\r\n# 获取当前状态名称\r\ncurrent = fsm.current  # 属性访问\r\n\r\n# 判断当前是否为指定状态\r\nif fsm.isState('Idle'):\r\n    print('Currently Idle')\r\n```\r\n\r\n### 回调\r\n\r\n每个状态配置支持以下回调：\r\n\r\n| 回调 | 调用时机 | 签名 |\r\n|------|---------|------|\r\n| `enter` | 进入该状态时 | `enter(owner, *args, **kwargs)` |\r\n| `exit` | 离开该状态时 | `exit(owner, *args, **kwargs)` |\r\n\r\n`*args` 和 `**kwargs` 来自 `accept()` 调用时传入的参数。\r\n\r\n### 完整示例\r\n\r\n```python\r\nfrom architect.fsm import FSM\r\n\r\nclass Monster:\r\n    def __init__(self):\r\n        states = {\r\n            'Idle': {\r\n                'accept': ['Patrol', 'Attack'],\r\n                'enter': lambda self: print('Monster is idle'),\r\n                'exit': lambda self: print('Monster stops idling'),\r\n            },\r\n            'Patrol': {\r\n                'accept': ['Idle', 'Attack'],\r\n                'enter': self.on_start_patrol,\r\n            },\r\n            'Attack': {\r\n                'accept': ['Idle'],\r\n                'enter': lambda self, target: print('Attacking %s' % target),\r\n            },\r\n        }\r\n        self.fsm = FSM(self, 'Idle', states)\r\n\r\n    def on_start_patrol(self):\r\n        print('Monster starts patrolling')\r\n\r\n    def update(self):\r\n        if self.fsm.isState('Idle'):\r\n            self.fsm.accept('Patrol')\r\n        elif self.fsm.isState('Patrol'):\r\n            self.fsm.accept('Attack', 'player_1')\r\n\r\n# 使用\r\nmonster = Monster()\r\nmonster.fsm.accept('Patrol')           # Idle -> Patrol\r\nmonster.fsm.accept('Attack', 'p1')     # Patrol -> Attack\r\nprint(monster.fsm.current)             # 'Attack'\r\n```\r\n\r\n## 已废弃：Statetree\r\n\r\n`architect.fsm.stateTree` 是旧版的状态树实现，已被 `FSM` 替代。新代码请使用 `FSM` 类。","index":"---\r\nlayout: home\r\nhero:\r\n  name: RoninNetease\r\n  text: 网易基岩版模组框架\r\n  tagline: 模块化 · 响应式 · ECS 架构\r\n  actions:\r\n    - theme: brand\r\n      text: 快速开始\r\n      link: /quickstart\r\n    - theme: alt\r\n      text: 架构设计\r\n      link: /architecture\r\n    - theme: alt\r\n      text: GitHub\r\n      link: https://github.com/reallyGoodBaker/RoninNetease\r\nfeatures:\r\n  - icon: \"🧩\"\r\n    title: ECS 组件系统\r\n    details: CompIndex 反向索引 + Query 自动注入\r\n  - icon: \"⚡\"\r\n    title: 装饰器驱动\r\n    details: Sched.Tick / EventListener / DefineFields 声明式编程\r\n  - icon: \"🎯\"\r\n    title: 响应式 UI\r\n    details: Signal/Sink 自动追踪数据变化\r\n  - icon: \"🔌\"\r\n    title: 插件热插拔\r\n    details: 拓扑排序依赖管理，完整生命周期钩子\r\n  - icon: \"📡\"\r\n    title: 跨端 RPC\r\n    details: Remote 装饰器 + Future 异步调用 + 参数验证\r\n  - icon: \"📊\"\r\n    title: 性能诊断\r\n    details: Profiler 毫秒级子系统耗时分析\r\n---","math":"# 数学工具 (architect.math)\r\n\r\n`architect.math` 提供了 3D 数学运算和实用工具函数，包括向量、矩阵和空间计算。\r\n\r\n## 坐标系\r\n\r\n- 右手坐标系\r\n- Y 轴向上\r\n- 旋转顺序: Yaw (绕 Y), Pitch (绕 X), Roll (绕 Z)\r\n\r\n## 导入方式\r\n\r\n```python\r\nfrom architect.math import vec3, mat4\r\nfrom architect.math import vec, Vector3, Matrix\r\n```\r\n\r\n---\r\n\r\n## Vector3 向量\r\n\r\n### 创建向量\r\n\r\n```python\r\nv1 = vec(1, 2, 3)              # 从分量创建\r\nv2 = vec((1, 2, 3))            # 从元组创建\r\nv3 = Vector3(1, 2, 3)          # 直接构造\r\n```\r\n\r\n### 向量运算\r\n\r\n```python\r\nv1 + v2                        # 加法\r\nv1 - v2                        # 减法\r\nv1 * 2.0                       # 标量乘法\r\nv1 / 2.0                       # 标量除法\r\n-v1                            # 取负\r\n\r\nvec.add(v1, v2)                # 加法函数\r\nvec.div(v1, 2)                 # 除法函数\r\nvec.modulo(v)                  # 长度取整\r\nvec.normalize(v)               # 归一化\r\nvec.tup(v)                     # 转为元组 (x, y, z)\r\n```\r\n\r\n### 向量属性\r\n\r\n```python\r\nv.x                            # X 分量\r\nv.y                            # Y 分量\r\nv.z                            # Z 分量\r\nv.Length()                     # 长度\r\nv.Normalized()                 # 归一化后的新向量\r\nv.ToTuple()                    # 转换为元组\r\n```\r\n\r\n---\r\n\r\n## Matrix 矩阵 (mat4)\r\n\r\n### 创建矩阵\r\n\r\n```python\r\nfrom architect.math.mat4 import identity, lookAt, perspective, inverse, multiply\r\n\r\nmat = identity()               # 单位矩阵\r\nmat = lookAt(eye, target, up)  # 视图矩阵（观察矩阵）\r\nmat = perspective(fov, aspect, near, far)  # 透视投影矩阵\r\n```\r\n\r\n### 矩阵运算\r\n\r\n```python\r\nmat3 = multiply(mat1, mat2)    # 矩阵乘法\r\ninv = inverse(mat)             # 矩阵求逆\r\n```\r\n\r\n### 矩阵变换\r\n\r\n```python\r\nfrom architect.math.mat4 import transformPoint, transform\r\n\r\n# 变换点\r\nresult = transformPoint(matrix, point)  # point: Vector3\r\n\r\n# 构造变换矩阵\r\ntransform(\r\n    identity(),           # 基础矩阵\r\n    vec(pos),             # 位置\r\n    vec(rot),             # 旋转 (yaw, pitch, roll)\r\n    vec(scale)            # 缩放\r\n)\r\n\r\n# 世界坐标转屏幕坐标\r\nworldToScreen(\r\n    identity(),           # 模型矩阵\r\n    localViewMatrix(),    # 观察矩阵\r\n    localProjectionMatrix(),  # 投影矩阵\r\n    screenSize(),         # 屏幕尺寸\r\n    worldPoint            # 世界坐标点\r\n)\r\n```\r\n\r\n---\r\n\r\n## 实用函数 (utils)\r\n\r\n### 屏幕坐标\r\n\r\n```python\r\nfrom architect.math.utils import screenSize, localViewMatrix, localProjectionMatrix\r\n\r\nsize = screenSize()                # 获取屏幕尺寸 (width, height)\r\nviewMat = localViewMatrix()        # 获取当前摄像机观察矩阵\r\nprojMat = localProjectionMatrix()  # 获取当前摄像机投影矩阵\r\n```\r\n\r\n### 世界坐标 <-> 屏幕坐标\r\n\r\n```python\r\nfrom architect.math.utils import worldPosToScreenPos, screenToWorld\r\n\r\n# 世界坐标 -> 屏幕坐标（仅客户端可用）\r\nscreenPos = worldPosToScreenPos((x, y, z))  # 返回 Vector3\r\n\r\n# 屏幕坐标 -> 世界坐标（射线投射）\r\nworldPos = screenToWorld(modelMatrix, screenPoint, filterType)\r\n```\r\n\r\n### 碰撞检测\r\n\r\n```python\r\nfrom architect.math.utils import pointInBox, pointInAabb\r\n\r\n# 点是否在盒子内（盒子以原点为中心）\r\npointInBox((x, y, z), (width, height, depth))  # -> bool\r\n\r\n# 点是否在 AABB 内\r\npointInAabb((x, y, z), (minX, minY, minZ), (maxX, maxY, maxZ))  # -> bool\r\n```\r\n\r\n### 实体空间查询\r\n\r\n```python\r\nfrom architect.math.utils import (\r\n    boxOverlap3dClient,    # 指定位置旋转的盒子重叠检测\r\n    boxOverlap3dForward,   # 实体前进方向的盒子重叠检测\r\n    boxOverlap3dFacing,    # 实体面朝方向的盒子重叠检测\r\n    forward,               # 实体前进方向向量\r\n    facing,                # 实体面朝方向向量\r\n    entityAabbDef,         # 实体的 AABB 定义\r\n    around,                # 实体周围实体列表\r\n)\r\n\r\n# 检测指定位置旋转的盒子的重叠实体\r\noverlapping = boxOverlap3dClient(pos, rot, size, debug=False)\r\n\r\n# 检测实体前进方向盒子重叠\r\noverlapping = boxOverlap3dForward(entityId, (width, height, depth))\r\n\r\n# 检测实体面朝方向盒子重叠\r\noverlapping = boxOverlap3dFacing(entityId, (width, height, depth))\r\n\r\n# 获取实体前进方向向量（XZ 平面）\r\ndir = forward(entityId, dist=1)          # 返回 Vector3\r\n\r\n# 获取实体面朝方向向量\r\ndir = facing(entityId)                   # 返回 Vector3\r\n\r\n# 获取实体头部 AABB 定义\r\nminPos, maxPos = entityAabbDef(entityId)  # 返回两个元组\r\n\r\n# 获取实体周围指定半径内的实体\r\nentities = around(entityId, radius)\r\n```\r\n\r\n### 工具常量\r\n\r\n```python\r\nfrom architect.math.utils import defaultFilters\r\n\r\n# Molang 默认过滤器（用于 query 等）\r\ndefaultFilters = {\r\n    'any_of': [\r\n        {'subject': 'other', 'test': 'is_family', 'value': 'player'},\r\n        {'subject': 'other', 'test': 'is_family', 'value': 'mob'},\r\n    ]\r\n}\r\n```\r\n\r\n---\r\n\r\n## Vector4 四维向量\r\n\r\n`architect.math.vec4` 提供四维向量，用于 3D 变换中的齐次坐标表示（如 `transformPoint` 内部计算），以及局长算法的部分中间结果。\r\n\r\n### 创建 Vector4\r\n\r\n```python\r\nfrom architect.math.vec4 import Vector4, vec4, tup4\r\n\r\nv1 = vec4(1, 2, 3, 1)              # 从分量创建 (x, y, z, w)\r\nv2 = vec4()                         # 默认为 (0, 0, 0, 1)\r\nv3 = vec4((1, 2, 3, 1))            # 从元组创建\r\nv4 = vec4(vec3_obj)                 # 从 Vector3 转换 (w=1)\r\nv5 = Vector4(1, 2, 3, 1)           # 直接构造\r\n```\r\n\r\n### Vector4 运算\r\n\r\n```python\r\nv1 + v2                            # 加法\r\nv1 - v2                            # 减法\r\nv1 * 2.0                           # 标量乘法\r\nv1 / 2.0                           # 标量除法\r\n\r\ntup4(v)                            # 转为元组 (x, y, z, w)\r\n```\r\n\r\n### Vector4 属性\r\n\r\n```python\r\nv.x                                # X 分量\r\nv.y                                # Y 分量\r\nv.z                                # Z 分量\r\nv.w                                # W 分量（齐次坐标）\r\n```\r\n\r\n### 使用场景\r\n\r\n```python\r\nfrom architect.math.vec4 import tup4\r\nfrom architect.math.mat4 import transformPoint\r\n\r\n# 矩阵变换点，内部使用齐次坐标\r\nmodelCenterPos = tup4(transformPoint(worldMatrix, centerPos))\r\n# 返回 (x, y, z, w) 元组\r\n```\r\n\r\n---\r\n\r\n## 子模块导入\r\n\r\n```python\r\n# 直接从子模块导入（不通过 compact）\r\nfrom architect.math.vec3 import vec, Vector3\r\nfrom architect.math.vec4 import vec4, Vector4, tup4\r\nfrom architect.math.mat4 import identity, lookAt, perspective\r\nfrom architect.math.utils import worldPosToScreenPos\r\n```\r\n\r\n---\r\n\r\n## 完整 API 对照\r\n\r\n| 功能 | 模块 | 说明 |\r\n|------|------|------|\r\n| 向量创建 | `vec3.vec` | 从元组或分量创建 Vector3 |\r\n| 向量运算 | `vec3.add`, `vec3.div`, `vec3.tup` | 加法, 除法, 转元组 |\r\n| 向量属性 | `Vector3.Length`, `.Normalized` | 长度, 归一化 |\r\n| 齐次坐标 | `vec4.vec4`, `vec4.Vector4`, `vec4.tup4` | 四维向量创建/转换 |\r\n| 单位矩阵 | `mat4.identity` | 创建 4x4 单位矩阵 |\r\n| 观察矩阵 | `mat4.lookAt` | 创建摄像机观察矩阵 |\r\n| 投影矩阵 | `mat4.perspective` | 创建透视投影矩阵 |\r\n| 矩阵求逆 | `mat4.inverse` | 矩阵求逆 |\r\n| 矩阵乘法 | `mat4.multiply` | 矩阵乘法 |\r\n| 点变换 | `mat4.transformPoint` | 变换点坐标 |\r\n| 变换矩阵 | `mat4.transform` | 构造位置+旋转+缩放变换矩阵 |\r\n| 屏幕坐标 | `utils.screenSize` | 获取屏幕尺寸 |\r\n| 世界转屏幕 | `utils.worldPosToScreenPos` | 3D -> 2D |\r\n| 屏幕转世界 | `utils.screenToWorld` | 射线投射 |\r\n| 碰撞检测 | `utils.pointInBox`, `utils.pointInAabb` | 点在盒子内检查 |\r\n| 空间查询 | `utils.boxOverlap3dClient` | 指定旋转盒子的重叠检测 |\r\n| 方向向量 | `utils.forward`, `utils.facing` | 实体方向 |\r\n| AABB | `utils.entityAabbDef` | 实体头部 AABB |\r\n| 周围实体 | `utils.around` | 半径内实体列表 |\r\n| 默认过滤器 | `utils.defaultFilters` | Molang 默认 filter |\r\n","plugin":"# 插件系统\n\n## 概念\n\n插件是框架的扩展单元，可注册在 `PLUGINS` 配置列表中。每个插件由 `@Plugin` 装饰器标记，实现 `PluginBase` 的方法，拥有完整的生命周期钩子。\n\n---\n\n## 定义插件\n\n```python\nfrom architect.compact import Plugin, PluginBase\n\n@Plugin('weather', ver=[1, 0, 0], author='Author', desc='天气系统插件')\nclass WeatherPlugin(PluginBase):\n\n    def onCreate(self):\n        \"插件类实例化时调用。\"\n        pass\n\n    def onAttach(self, manager):\n        \"框架初始化时调用。manager 是 SubsystemManager 实例。\"\n        pass\n\n    def onReady(self, manager):\n        \"所有子系统创建完毕后调用。\"\n        pass\n\n    def onRegisterComponent(self, compCls):\n        \"框架注册组件时调用。插件可以在此注入或替换组件。\"\n        pass\n\n    def onAddSubsystem(self, subsystem):\n        \"框架添加子系统时调用。\"\n        pass\n\n    def onRemoveSubsystem(self, subsystem):\n        \"框架移除子系统时调用。\"\n        pass\n\n    def onDestroy(self):\n        \"插件被卸载时调用。\"\n        pass\n```\n\n---\n\n## 在 `conf.py` 中启用插件\n\n```python\n# conf.py\nPLUGINS = [\n    '$vendor.weather',\n    '$user.myPlugin',\n]\n# $vendor → architect/plugins/\n# $user   → my_mod/plugins/\n```\n\n---\n\n## 声明依赖 — v1.1.0\n\n插件可以通过 `deps` 参数声明对其他插件的依赖。框架在加载时按拓扑排序执行，确保依赖项先加载。\n\n```python\n@Plugin('combat', ver=[1, 0, 0], deps={'weather': '>=1.0.0'})\nclass CombatPlugin(PluginBase):\n    \"combat 插件依赖 weather 插件 >= 1.0.0\"\n    pass\n```\n\n拓扑排序带循环依赖安全防护——出现循环时不会死循环，按注册顺序兜底加载。\n\n---\n\n## 运行时获取插件\n\n```python\nfrom architect.compact import getPlugin, hasPlugin\n\nif hasPlugin('weather'):\n    plugin = getPlugin('weather')\n```","quickstart":"# 快速开始\n\n本指南从零开始构建一个完整的网易《我的世界》模组，涵盖 RoninNetease v1.1.0 的所有核心 API。\n\n所有 API 均可从 `architect.compact` 按需导入。\n\n---\n\n## 1. 项目结构\n\n```\nmy_mod/\n├── modMain.py              # 模组入口\n├── conf.py                 # 配置文件\n├── server_system.py        # 服务端子系统\n├── client_system.py        # 客户端子系统\n├── components.py           # 组件定义\n└── architect/              # 框架本体\n```\n\n---\n\n## 2. 配置文件 `conf.py`\n\n```python\n# conf.py — 必须定义引擎命名空间和系统名称\nMOD_ENGINE_NAME = 'my_mod'\nMOD_SYSTEM_NAME = 'my_system'\n```\n\n> 更高级的配置选项（模块列表、插件列表、热更新白名单）详见 `architecture.md` 中的配置覆盖机制章节。\n\n---\n\n## 3. 模组入口 `modMain.py`\n\n```python\n# modMain.py\nfrom architect.compact import createServer, createClient\n\ndef modInit():\n    createServer()   # 启动 SubsystemManager（服务端）\n    createClient()   # 启动 SubsystemManager（客户端）\n```\n\n---\n\n## 4. 服务端子系统 — 完整示例\n\n```python\n# server_system.py\nfrom architect.compact import SubsystemServer, ServerSubsystem, Sched, Query, EntityId\n\n# ===== 组件定义 =====\nfrom architect.component import Component, BaseCompServer\nfrom architect.component.schema import FieldSchema, DefineFields\n\n@Component()\n@DefineFields(\n    health=FieldSchema(default=100, validator=lambda v: 0 <= v <= 1000),\n    name=FieldSchema(default='unnamed'),\n)\nclass HealthComponent(BaseCompServer):\n    \"血量数据结构，字段由框架自动初始化。\"\n    def onCreate(self, entityId):\n        self.max_health = self.health  # 额外初始化\n    def onDestroy(self, entityId):\n        pass\n\n# ===== 子系统定义 =====\n@SubsystemServer\nclass HealthSystem(ServerSubsystem):\n\n    def onInit(self):\n        self.canTick = True          # 必须设为 True 才能驱动 @Query 方法\n        print('[Server] HealthSystem 初始化完毕')\n\n    def onReady(self):\n        \"\"\"所有子系统创建完毕后调用。\"\"\"\n        print('[Server] 所有系统已就绪')\n\n    @Sched.Tick()\n    @Query(HealthComponent, EntityId)\n    def process_health(self, entityId, health):\n        \"\"\"每个 Tick 自动遍历所有拥有 HealthComponent 的实体。\"\"\"\n        if health.health <= 0:\n            self.destroyEntity(entityId)\n            print('实体已死亡:', entityId)\n\n    def onDestroy(self):\n        print('[Server] HealthSystem 已销毁')\n```\n\n---\n\n## 5. 客户端子系统\n\n```python\n# client_system.py\nfrom architect.compact import SubsystemClient, ClientSubsystem, Sched\n\n@SubsystemClient\nclass RenderSystem(ClientSubsystem):\n\n    def onInit(self):\n        self.canTick = True\n\n    @Sched.Render()\n    def onRender(self, args):\n        \"每个渲染帧执行（60tps 环境约 60fps）\"\n        pass\n\n    def sendServer(self, eventName, eventData):\n        self.system.NotifyToServer(eventName, eventData)\n```\n\n---\n\n## 6. 事件监听\n\n```python\nfrom architect.compact import EventListener, ChainedEvent\n\nclass MonsterSystem(ServerSubsystem):\n\n    @EventListener('EntityDeathEvent')\n    def on_entity_death(self, event):\n        \"event 是一个 ChainedEvent 对象。\"\n        dead_id = event.entityId\n        # 阻止后续监听器被调用\n        event.stop()\n        # 或者阻止引擎默认行为\n        event.prevent()\n```\n\n### 自定义事件\n\n```python\nfrom architect.compact import CustomEvent\n\nclass QuestSystem(ServerSubsystem):\n\n    @CustomEvent('QuestCompleted')\n    def on_quest_done(self, event):\n        player = event.playerId\n        reward = event.reward\n        print('任务完成:', player, reward)\n```\n\n---\n\n## 7. 远程调用 RPC\n\n### 服务端暴露方法\n\n```python\nfrom architect.compact import Remote\n\nclass GameSystem(ServerSubsystem):\n\n    @Remote(itemId=str, amount=lambda v: isinstance(v, int) and v > 0)\n    def give_item(self, playerId, itemId, amount):\n        \"playerId 由框架自动注入。itemId/amount 在服务端验证参数类型。\"\n        pass\n```\n\n### 客户端调用\n\n```python\nfrom architect.compact import remote\n\n# 发送消息不等待返回\nremote.client.call('GameSystem.give_item', 'diamond', 10)\n\n# 异步调用并等待结果\nfuture = remote.client.invoke('GameSystem.get_score')\nfuture.done(lambda score: print('分数:', score))\n```\n\n---\n\n## 8. 响应式 UI\n\n```python\nfrom architect.compact import UiSubsystem, signal, Sink, Screen, AutoCreate\n\n@Screen\n@AutoCreate\nclass MainScreen(UiSubsystem):\n\n    def onCreate(self):\n        self.get_score, self.set_score = signal(0)\n\n    @Sink\n    def update_label(self):\n        \"当依赖的 signal 变化时自动重新执行。\"\n        label = self.find('/label')\n        label.SetText('Score: ' + str(self.get_score()))\n\n    def add_points(self, pts):\n        self.set_score(self.get_score() + pts)\n```\n\n---\n\n## 9. 插件系统\n\n```python\nfrom architect.compact import Plugin, PluginBase\n\n@Plugin('myPlugin', ver=[1, 0, 0], deps={'basePlugin': '>=1.0.0'})\nclass MyPlugin(PluginBase):\n\n    def onCreate(self):\n        pass\n\n    def onAttach(self, manager):\n        print('插件已挂载')\n\n    def onDestroy(self):\n        print('插件已卸载')\n```\n\n---\n\n## 10. 性能诊断 Profiler\n\n```python\nfrom architect.core.profiler import profiler\n\n# 包裹任何代码块进行计时\nwith profiler.record('expensive_logic'):\n    do_work()\n\n# 在子系统中定期导出快照\nclass DebugSystem(ServerSubsystem):\n    def onUpdate(self, dt):\n        snap = profiler.flush()\n        # { 'scheduler.tickSkipped': {'avg_ms': 0.0, ...}, ... }\n        for k, s in snap.items():\n            if s['max_ms'] > 16:\n                print('[PERF]', k, s['avg_ms'], 'ms')\n```\n\n---\n\n## 11. CommandBus 解耦子系统\n\n```python\nfrom architect.core.subsystem import SubsystemManager\n\nmgr = SubsystemManager.getInstance()\n\n# Provider 注册\nmgr.bus.register('enemy_killed', lambda boss_id: print('boss defeated:', boss_id))\n\n# Consumer 调用\nmgr.bus.execute('enemy_killed', 'dragon')\n```\n\n---\n\n## 完整 API 索引\n\n| 模块 | 代表性导出 |\n|------|-----------|\n| **architect.compact** | 统一入口，包含以下所有 |\n| Subsystem | `SubsystemServer`, `SubsystemClient`, `Internal` |\n| Scheduler | `Sched`, `Scheduler`, `Future`, `Async` |\n| Component | `Component`, `createComponent`, `hasComponent`, `Marker` |\n| Component Schema | `FieldSchema`, `DefineFields` |\n| Query | `Query`, `EntityId`, `ExtraArguments`, `ExtraArgDict` |\n| Event | `EventListener`, `CustomEvent`, `ChainedEvent` |\n| Remote | `Remote`, `remote.client`, `remote.server` |\n| UI | `UiSubsystem`, `signal`, `Sink`, `Screen`, `AutoCreate` |\n| Plugin | `Plugin`, `PluginBase`, `getPlugin` |\n| CommandBus | `CommandBus` (通过 `SubsystemManager.bus` 访问) |\n| Profiler | `Profiler`, `profiler` |\n| Config | `modConf()` 获取/修改框架和模组配置 |\n| Math | `vec3`, `mat4`, `vec4`（详见 math.md） |","scheduler":"# 调度系统\n\n## 四种调度类型\n\n| 装饰器 | 触发时机 | 运行环境 | 典型场景 |\n|--------|----------|----------|----------|\n| `@Sched.Tick()` | 每游戏 Tick (~50ms) | Server & Client | 游戏逻辑、AI |\n| `@Sched.Render()` | 每渲染帧 | **仅 Client** | 特效、动画 |\n| `@Sched.Fixed('name')` | 固定间隔（秒） | 任意 | 自动保存、心跳 |\n| `@Sched.Event('EventName')` | 指定事件触发 | 任意 | 事件驱动任务 |\n\n---\n\n## 使用方式\n\n```python\nfrom architect.compact import Sched, SchedUpdateFlags, SchedEventFlags\n\nclass GameSystem(ServerSubsystem):\n\n    @Sched.Tick(SchedUpdateFlags.Update)\n    def every_tick(self, args):\n        pass  # 每个 Tick 在 Update 阶段执行\n\n    @Sched.Tick(SchedUpdateFlags.BeforeUpdate)\n    def before_update(self, args):\n        pass  # 在 Update 之前执行\n\n    @Sched.Render()\n    def every_frame(self, args):\n        pass  # 客户端每帧执行\n```\n\n---\n\n## 固定频率调度\n\n```python\nclass SaveSystem(ServerSubsystem):\n\n    def onInit(self):\n        self.scheduleFixed('save', period=10)  # 每 10 秒执行\n\n    @Sched.Fixed('save')\n    def auto_save(self):\n        print('保存数据...')\n\n    def onDestroy(self):\n        self.stopFixed('save')\n```\n\n---\n\n## 事件触发调度\n\n```python\nclass BossSystem(ServerSubsystem):\n\n    @Sched.Event('BossSpawned', isCustom=True, scheduleFlag=SchedEventFlags.Event)\n    def on_boss_spawn(self):\n        print('Boss 出现！开始 AI 逻辑')\n```\n\n---\n\n## 底层 Scheduler API\n\n如果不想使用装饰器，也可以直接操作 `Scheduler` 实例：\n\n```python\nfrom architect.core.scheduler import Scheduler\n\nsched = Scheduler()\nsched.addTask('Update', my_func)       # 注册任务\nsched.addSuspendableTask('Update', my_gen)  # 协程任务\nsched.executeSequence()                # 执行一轮\nsched.removeTask('Update', task_id)    # 取消任务\n```\n\n---\n\n## 异步 Future 与协程\n\n```python\nfrom architect.core.scheduler import Future, Async\n\n@Async\ndef fetch_data():\n    \"生成器函数转异步协程。yield 出来的 Future 会被自动等待。\"\n    result1 = yield remote.client.invoke('Server.check_login')\n    result2 = yield remote.client.invoke('Server.get_profile')\n    return result1, result2\n\n# 调用\nftr = fetch_data()\nftr.done(lambda data: print('获取完成:', data))\nftr.expected(lambda err: print('失败:', err))\n```\n\n---\n\n## 重入保护\n\n如果上一个 `executeSequence` 还未完成（某任务耗时超过一个 Tick），当前帧**直接跳过**并递增内部计数器。\n\n```python\nsched.getSkippedUpdates()  # 返回跳过帧数（通过 Profiler 可观测）\n```\n\n这不是 Bug——跳帧是单线程环境下的止损策略（排队会导致无限堆积）。跳过帧数通过 Profiler 的 `scheduler.tickSkipped` 指标暴露，开发者可以据此识别性能瓶颈。","statetree":"# 状态树 (architect.fsm.stateTree)\r\n\r\n树形有限状态机，比传统 FSM 灵活性稍低但更易于模块化。将状态组织成树结构，支持自动搜索可进入的叶子节点、沿路径切换、向上回溯等能力。\r\n\r\n## 核心概念\r\n\r\n状态树将状态组织为一棵**多叉树**：\r\n- **叶子节点**：真正的\"状态\"，每帧只能激活一个叶子节点\r\n- **非叶子节点**：作为\"分类/分组\"，不执行逻辑，但可以控制子树整体的进入/退出条件\r\n- **搜索算法**：每帧自动沿树向下搜索第一个可进入的叶子节点，找不到则向上回溯\r\n- **激活路径**：当前激活的叶子节点 + 其所有祖先节点构成\"激活路径\"，路径上所有节点的 `update()` 都会被调用\r\n\r\n## StateTree\r\n\r\n状态树的核心类，继承自 `Unreliable`（异常安全）：\r\n\r\n```python\r\nfrom architect.fsm.stateTree.common import StateTree, StateNode\r\n```\r\n\r\n### 树结构管理\r\n\r\n```python\r\ntree = StateTree(entityId)\r\n\r\n# 创建根节点（默认名为 'root'）\r\nroot = tree.getRoot()\r\n\r\n# 创建新节点并插入\r\nnode = StateNode('attack')\r\ntree.insertNode(node, parent=root)\r\n\r\n# 创建匿名节点\r\nnode = tree.createNode(parent=root)\r\n\r\n# 查找节点\r\nnode = tree.findNamedNode('attack')\r\n```\r\n\r\n### 节点替换\r\n\r\n```python\r\n# 替换节点\r\ntree.replaceNode(oldNode, newNode)\r\ntree.replaceNamedNode('attack', newAttackNode)\r\n\r\n# 替换根节点\r\nnewRoot = StateNode('newRoot')\r\ntree.replaceNode(None, newRoot)\r\n# 等价于\r\ntree.setRoot(newRoot)\r\n```\r\n\r\n### 状态执行\r\n\r\n```python\r\n# 每帧调用：搜索下一个叶子节点并切换\r\ntree.execute()\r\n\r\n# 强制切换到指定节点（跳过搜索）\r\ntree.switchNode(targetNode)\r\n\r\n# 重置状态\r\ntree.reset()                   # 重置到初始状态\r\ntree.reset(clearMapping=True)  # 重置并清空映射\r\n```\r\n\r\n### 状态查询\r\n\r\n```python\r\n# 当前状态\r\ncurrent = tree.getCurrent()\r\ncurrent = tree.currentState()\r\nname = tree.currentStateName()\r\n\r\n# 检查是否已完成（即没有激活的叶子节点）\r\nif tree.isFinished():\r\n    pass\r\n\r\n# 获取当前激活路径上的所有节点（从根到当前叶子）\r\nactiveNodes = tree.findAllActivatedStateNodes()\r\n```\r\n\r\n### 内部搜索算法\r\n\r\n`searchNode()` 的搜索逻辑：\r\n\r\n1. **无当前节点** → 从根节点开始深度优先搜索第一个可进入的叶子\r\n2. **当前是叶子** → 先搜索同级兄弟节点，找不到则向上回溯到父节点继续搜索兄弟子树\r\n3. **当前是非叶子** → 继续向下搜索子节点中的叶子\r\n4. 如果某个祖先的 `canEnter()` 返回 `False`，则跳过它继续向上\r\n5. 每步都会检查 `canEnter()` / `canExit()` 条件\r\n\r\n每次 `execute()` 调用流程：\r\n1. 调用所有激活路径上节点的 `update(tree)`\r\n2. 调用 `searchNode()` 搜索下一个可进入的叶子\r\n3. 如果找到，沿路径依次 `exit` 当前节点 → `enter` 路径上的所有节点 → 最终到达目标叶子\r\n\r\n## StateNode\r\n\r\n状态节点，可包含子节点形成树结构：\r\n\r\n```python\r\nclass StateNode:\r\n    def __init__(self, name='unknown'):\r\n        pass\r\n```\r\n\r\n### 生命周期钩子\r\n\r\n```python\r\nclass MyNode(StateNode):\r\n    def canEnter(self, tree):\r\n        \"\"\"是否允许进入此节点（包括其子树）\"\"\"\r\n        return True\r\n\r\n    def canExit(self, tree):\r\n        \"\"\"是否允许退出此节点\"\"\"\r\n        return True\r\n\r\n    def enter(self, previous, tree):\r\n        \"\"\"进入时回调\r\n        Args:\r\n            previous: 前一个叶子节点\r\n            tree: 状态树实例\r\n        \"\"\"\r\n\r\n    def exit(self, nextNode, tree):\r\n        \"\"\"退出时回调\r\n        Args:\r\n            nextNode: 下一个叶子节点\r\n            tree: 状态树实例\r\n        \"\"\"\r\n\r\n    def update(self, tree):\r\n        \"\"\"每帧更新回调（仅在激活路径上时调用）\"\"\"\r\n```\r\n\r\n### 树操作\r\n\r\n```python\r\nnode = StateNode('parent')\r\n\r\n# 添加子节点\r\nchild1 = StateNode('child1')\r\nchild2 = StateNode('child2')\r\nnode.addChildren(child1, child2)\r\n\r\n# 移除子节点\r\nnode.removeChild(child1)\r\n\r\n# 在指定位置插入\r\nnode.insert(0, newChild)\r\n\r\n# 替换子节点\r\nnode.replaceChild(oldNode, newNode)\r\n\r\n# 查找子节点（递归）\r\nfound = node.findNamedNode('child2')\r\n```\r\n\r\n### 上下文（Context）\r\n\r\n节点支持键值对上下文，子节点可以继承父节点的上下文：\r\n\r\n```python\r\nroot = StateNode('root')\r\nroot.setContext('speed', 10)\r\nroot.setContext('damage', 50)\r\n\r\nchild = StateNode('child')\r\nroot.addChildren(child)\r\n\r\n# 子节点可以获取父节点的上下文\r\nprint(child.getContext('speed'))   # 10 （从父节点继承）\r\nprint(child.getContext('damage'))  # 50 （从父节点继承）\r\n\r\n# 子节点也可以覆盖\r\nchild.setContext('speed', 20)\r\nprint(child.getContext('speed'))   # 20 （覆盖父节点值）\r\n```\r\n\r\n### 节点复制\r\n\r\n```python\r\noriginal = MyCustomNode('test')\r\noriginal.setContext('key', 'value')\r\n\r\n# 深复制（递归复制所有子节点）\r\ncopy = original.copy(deep=True)\r\n\r\n# 浅复制（只复制当前节点，不含子节点）\r\nshallow = original.copy(deep=False)\r\n```\r\n\r\n复制规则：\r\n- 保留 `_parent` 和 `children` 之外的所有实例属性\r\n- 子类的自定义属性也会被复制\r\n- 返回的节点是完全独立的树根（`_parent = None`）\r\n\r\n## StateNodeServer（服务端扩展）\r\n\r\n服务端专用的节点类，提供引擎操作封装：\r\n\r\n```python\r\nfrom architect.fsm.stateTree.server import StateNodeServer\r\n\r\nclass MyServerNode(StateNodeServer):\r\n    def __init__(self, name, subsystem=None):\r\n        StateNodeServer.__init__(self, name, subsystem)\r\n```\r\n\r\n### 实体变体控制\r\n\r\n```python\r\nclass MyNode(StateNodeServer):\r\n    def enter(self, previous, tree):\r\n        # 设置实体 MarkVariant\r\n        self.markVariant(tree.entityId, 2)\r\n\r\n    def exit(self, nextNode, tree):\r\n        # 获取实体当前 MarkVariant\r\n        variant = self.markVariant(tree.entityId)\r\n```\r\n\r\n### 音效播放\r\n\r\n```python\r\nclass MyNode(StateNodeServer):\r\n    def enter(self, previous, tree):\r\n        # 在实体位置播放音效\r\n        self.playSound(tree.entityId, 'minecraft:entity.player.attack')\r\n```\r\n\r\n### 移动控制\r\n\r\n```python\r\nclass MyNode(StateNodeServer):\r\n    def enter(self, previous, tree):\r\n        # 禁用实体移动\r\n        self.movement(tree.entityId, enabled=False)\r\n        # 启用实体移动\r\n        self.movement(tree.entityId, enabled=True)\r\n```\r\n\r\n对玩家使用 `inputpermission` 指令控制；对非玩家实体则调整 `AttrType.SPEED`。\r\n\r\n### 摄像机控制\r\n\r\n```python\r\nclass MyNode(StateNodeServer):\r\n    def enter(self, previous, tree):\r\n        # 禁用摄像机控制\r\n        self.camera(tree.entityId, enabled=False)\r\n        # 启用摄像机控制\r\n        self.camera(tree.entityId, enabled=True)\r\n```\r\n\r\n使用 `inputpermission camera` 指令控制。\r\n\r\n### 快速创建子节点\r\n\r\n```python\r\nclass MyNode(StateNodeServer):\r\n    def enter(self, previous, tree):\r\n        # 创建子节点（自动设置 subsystem 和父引用）\r\n        child = self.createChild('sub_state', MyChildNode)\r\n```\r\n\r\n## ECS 组件集成\r\n\r\n状态树通过 ECS 组件与子系统集成，在 `onUpdate` 中每帧自动调用 `execute()`：\r\n\r\n```python\r\nfrom architect.fsm.stateTree.server import StateTreeCompServer\r\nfrom architect.fsm.stateTree.client import StateTreeCompClient\r\n\r\n# 服务端：为实体附加状态树组件\r\n# 在组件的 onCreate 中自动注册到子系统\r\n\r\n# 启用/禁用状态树执行\r\ncomp.enabled = True   # 开始执行\r\ncomp.enabled = False  # 暂停执行\r\n```\r\n\r\n## 完整示例\r\n\r\n```python\r\nfrom architect.fsm.stateTree.common import StateTree, StateNode\r\nfrom architect.fsm.stateTree.server import StateNodeServer\r\n\r\n# 定义状态节点\r\nclass IdleNode(StateNode):\r\n    def enter(self, previous, tree):\r\n        print(f'Entity {tree.entityId}: Enter idle')\r\n\r\n    def update(self, tree):\r\n        print(f'Idle tick {tree.stateTicks}')\r\n\r\n    def canExit(self, tree):\r\n        # 在 idle 停留至少 10 tick 后才能退出\r\n        return tree.stateTicks >= 10\r\n\r\nclass PatrolNode(StateNode):\r\n    def enter(self, previous, tree):\r\n        print(f'Entity {tree.entityId}: Start patrol')\r\n\r\n    def update(self, tree):\r\n        print(f'Patrol tick {tree.stateTicks}')\r\n\r\n    def canExit(self, tree):\r\n        return tree.stateTicks >= 20\r\n\r\nclass ChaseNode(StateNode):\r\n    def enter(self, previous, tree):\r\n        print(f'Entity {tree.entityId}: Chase!')\r\n\r\n    def update(self, tree):\r\n        print(f'Chase tick {tree.stateTicks}')\r\n\r\n# 构建状态树\r\ntree = StateTree(entityId)\r\n\r\nroot = tree.getRoot()\r\naction = StateNode('action')\r\ntree.insertNode(action, root)\r\n\r\ntree.insertNode(IdleNode('idle'), action)\r\ntree.insertNode(PatrolNode('patrol'), action)\r\ntree.insertNode(ChaseNode('chase'), action)\r\n\r\n# 启用并开始执行\r\ncomp = tree  # 如果是通过 ECS 组件\r\ncomp.enabled = True\r\n\r\n# 每帧主动调用（如果使用了 ECS 组件则自动调用）\r\ntree.execute()\r\n```\r\n\r\n## 与 FSM 的区别\r\n\r\n| 特性 | FSM (`architect.fsm`) | StateTree (`architect.fsm.stateTree`) |\r\n|------|----------------------|--------------------------------------|\r\n| 结构 | 扁平状态列表 | 树形状态层级 |\r\n| 状态切换 | 手动调用 `transitionTo` | 自动搜索可进入的叶子节点 |\r\n| 分组能力 | 无 | 非叶子节点可分组控制 |\r\n| 条件检测 | 在切换时检查 | 每帧自动搜索 |\r\n| 上下文继承 | 无 | 父子节点上下文链 |\r\n| 复杂度 | 更灵活 | 更模块化 |","subsystem":"# 子系统\n\n## 概念\n\n子系统是业务逻辑的唯一载体。每个子系统负责一个功能域（战斗、背包、任务等），由 `SubsystemManager` 统一管理完整的生命周期。\n\n---\n\n## 定义子系统\n\n```python\nfrom architect.compact import ServerSubsystem, ClientSubsystem, SubsystemServer\n\n@SubsystemServer\nclass CombatSystem(ServerSubsystem):\n    \"在服务端运行，包含所有战斗逻辑。\"\n    pass\n```\n\n---\n\n## 生命周期\n\n| 方法 | 调用时机 | 典型用途 |\n|------|----------|----------|\n| `onInit()` | 当前子系统创建完毕 | 注册监听器、初始化数据结构、设 `canTick=True` |\n| `onReady()` | **所有**子系统创建完毕后调用 | 安全获取其他子系统、启动定时器 |\n| `onUpdate(dt)` | 每 Tick（需 `canTick=True`） | 核心逻辑更新。`dt` 为上次 Tick 的秒数 |\n| `onRender(dt)` | 每帧（**仅客户端**） | 渲染相关逻辑 |\n| `onDestroy()` | 子系统被移除时 | 清理资源、注销事件 |\n\n```python\n@SubsystemServer\nclass InventorySystem(ServerSubsystem):\n\n    def onInit(self):\n        self.data = {}\n        self.canTick = True\n\n    def onReady(self):\n        # 所有系统就绪，可获取其他子系统\n        other = SubsystemManager.getInstance().getSubsystem(CombatSystem)\n\n    def onUpdate(self, dt):\n        # 每 tick 执行\n        pass\n\n    def onDestroy(self):\n        self.data.clear()\n```\n\n---\n\n## 获取子系统实例\n\n```python\nfrom architect.core.subsystem import SubsystemManager\n\nmgr = SubsystemManager.getInstance()\ncombat = mgr.getSubsystem(CombatSystem)\ncombat = mgr.getSubsystemByName('CombatSystem')\n```\n\n---\n\n## 通信方法\n\n### 服务端 → 客户端 / 全体客户端\n\n```python\nclass ServerSystem(ServerSubsystem):\n    def notify_player(self, pid):\n        self.sendClient(pid, 'UpdateInventory', {'slots': [...]})\n    def broadcast_message(self, msg):\n        self.sendAllClients('ChatMsg', {'text': msg})\n```\n\n### 客户端 → 服务端\n\n```python\nclass ClientSystem(ClientSubsystem):\n    def request_purchase(self, item_id):\n        self.sendServer('BuyItem', {'itemId': item_id})\n```\n\n---\n\n## 快捷代理: `subsystem`（小写类）\n\n```python\nfrom architect.core.subsystem import subsystem\n\n# 无需获取具体子系统实例——框架自动代理第一个注册的子系统\nsubsystem.sendServer('RequestItem', {'itemId': 'diamond'})\nsubsystem.spawnServerEntity('minecraft:zombie', loc, (0, 0))\n```\n\n当模组中只有一个服务端子类、一个客户端子类时，`subsystem` 提供了最简洁的 API。\n多子系统场景请使用 `SubsystemManager.getSubsystem(YourClass)` 获取精确实例。\n\n---\n\n## `@Internal` 访问控制 — v1.1.0\n\n标记为 `@Internal` 的方法禁止被外部子系统直接调用，必须通过 CommandBus 或事件系统间接访问。\n\n```python\nfrom architect.core.subsystem import Internal\n\nclass CombatSystem(ServerSubsystem):\n\n    @Internal\n    def compute_damage(self, attacker_id, target_id):\n        \"内部计算逻辑。其他系统请走 bus.execute('compute_damage')。\"\n        return {'effective': 50}\n```\n\n---\n\n## 固定频率调度器\n\n```python\nclass AutoSaveSystem(ServerSubsystem):\n\n    def onInit(self):\n        self.scheduleFixed('save', period=5)  # 每 5 秒执行一次\n\n    @Sched.Fixed('save')\n    def auto_save(self):\n        print('自动保存中...')\n```","ui":"# UI 系统\n\n## 概念\n\n`UiSubsystem` 是客户端专用于 UI 管理的子系统，内建了**响应式数据绑定**（Signal/Sink）模式，自动追踪数据变化并更新控件。\n\n---\n\n## 定义 UI\n\n```python\nfrom architect.compact import UiSubsystem, Screen, AutoCreate\n\n@Screen       # 标记为全屏 UI\n@AutoCreate   # 框架初始化完成后自动创建\nclass MainScreen(UiSubsystem):\n    pass\n```\n\n---\n\n## 生命周期\n\n| 方法 | 调用时机 |\n|------|----------|\n| `onCreate()` | UI 被创建后立即调用（在 Create 中） |\n| `onBackPressed()` | 玩家按返回键时调用（返回 True 阻止关闭） |\n| `onDestroy()` | UI 被销毁时调用 |\n\n```python\nclass MainScreen(UiSubsystem):\n\n    def onCreate(self):\n        print('UI 已创建')\n\n    def onBackPressed(self):\n        \"返回 True 可阻止 UI 关闭。\"\n        return True  # 禁止关闭此屏\n```\n\n---\n\n## 控件查找\n\n```python\nclass MainScreen(UiSubsystem):\n\n    def onCreate(self):\n        # 通过路径查找\n        btn = self.find('/panel/button')\n        # 通过名称查找\n        btn = self.findByName('my_button')\n        # 根控件\n        root = self.rootControl\n```\n\n---\n\n## 响应式数据绑定 (Signal/Sink)\n\n```python\nfrom architect.compact import signal, Sink\n\nclass HUD(UiSubsystem):\n\n    def onCreate(self):\n        # signal 返回 (getter, setter) 元组\n        self.get_score, self.set_score = signal(0)\n        self.get_name, self.set_name = signal('Player1')\n\n    @Sink\n    def update_display(self):\n        \"当依赖的 signal 值变化时自动重新执行。\n        Sink 首次执行时自动追踪所有被 getter() 调用的 signal。\"\n        label = self.find('/label')\n        label.SetText(self.get_name() + ': ' + str(self.get_score()))\n\n    def add_score(self, pts):\n        self.set_score(self.get_score() + pts)  # 自动触发 update_display\n```\n\n### 原理\n\n1. `@Sink` 装饰的方法首次执行时，`SinkContext` 会追踪所有被调用的 `getter()`\n2. 当任意被追踪的 `signal` 通过 `setter()` 更新，`@Sink` 方法自动重新执行\n3. 类似 Vue 的 computed / Solid.js 的 createEffect\n\n---\n\n## 手势事件\n\n```python\nclass MainScreen(UiSubsystem):\n\n    def onCreate(self):\n        # 注册按钮点击事件\n        self.addEventListener('/btn', 'ButtonTouchUpInsideEvent', self.on_click)\n\n    def on_click(self, event):\n        print('按钮被点击:', event.control)\n```\n\n支持的手势类型：`ButtonTouchDownEvent`、`ButtonTouchUpEvent`、`ButtonTouchUpInsideEvent`、`ButtonTouchUpOutsideEvent`、`ButtonDragEvent`、`ButtonLongPressEvent`。\n\n---\n\n## 创建/管理\n\n```python\n# 获取或创建实例（存在则返回已有）\nui = MainScreen.getOrCreate(param1='val')\n\n# 强制创建（存在则先销毁旧的）\nui = MainScreen.create(param1='val')\n\n# 作为全屏界面 push\nui = MainScreen.pushScreen()\n\n# 关闭\nui.remove()\n```","utils":"# 常用工具与扩展 (Utils)\r\n\r\n`architect` 提供了丰富的辅助模块，涵盖引擎组件封装、绘图工具、动画效果等。\r\n\r\n## 引擎组件封装 (architect.level)\r\n\r\n通过 `LevelServer` 和 `LevelClient` 类，静态访问预创建好的引擎组件。\r\n\r\n### LevelServer（服务端）\r\n\r\n```python\r\nfrom architect.level.server import LevelServer\r\n\r\nLevelServer.game               # 游戏组件\r\nLevelServer.chunkSource        # 区块源\r\nLevelServer.achievement        # 成就\r\nLevelServer.biome              # 生物群系\r\nLevelServer.dimension          # 维度\r\nLevelServer.blockInfo          # 方块信息\r\nLevelServer.weather            # 天气\r\nLevelServer.time               # 时间\r\nLevelServer.block              # 方块\r\nLevelServer.blockEntity        # 方块实体\r\nLevelServer.blockEntityData    # 方块实体数据\r\nLevelServer.blockState         # 方块状态\r\nLevelServer.blockUseEventWhiteList  # 方块使用事件白名单\r\nLevelServer.message            # 消息\r\nLevelServer.command            # 命令\r\nLevelServer.chestBlock         # 箱子\r\nLevelServer.explosion          # 爆炸\r\nLevelServer.extraData          # 额外数据\r\nLevelServer.feature            # 特征\r\nLevelServer.itemBanned         # 禁用物品\r\nLevelServer.mobSpawn           # 生物生成\r\nLevelServer.projectile         # 抛射物\r\nLevelServer.portal             # 传送门\r\nLevelServer.recipe             # 配方\r\nLevelServer.redstone           # 红石\r\n```\r\n\r\n### LevelClient（客户端）\r\n\r\n```python\r\nfrom architect.level.client import LevelClient\r\n\r\nlevel = LevelClient.getInstance()\r\n\r\nlevel.localPlayer              # 本地玩家\r\nlevel.achievement              # 成就\r\nlevel.actorRender              # 实体渲染\r\nlevel.biome                    # 生物群系\r\nlevel.block                    # 方块\r\nlevel.blockGeometry            # 方块几何\r\nlevel.blockInfo                # 方块信息\r\nlevel.blockUseEventWhiteList   # 方块使用事件白名单\r\nlevel.camera                   # 摄像机\r\nlevel.chunkSource              # 区块源\r\nlevel.configClient             # 客户端配置\r\nlevel.customAudio              # 自定义音频\r\nlevel.dimension                # 维度\r\nlevel.drawing                  # 绘制\r\nlevel.fog                      # 雾\r\nlevel.game                     # 游戏\r\nlevel.model                    # 模型\r\nlevel.neteaseShop              # 网易商店\r\nlevel.operation                # 操作\r\nlevel.playerView               # 玩家视角\r\nlevel.postProcess              # 后处理\r\nlevel.recipe                   # 配方\r\nlevel.skyRender                # 天空渲染\r\nlevel.textBoard                # 文本板\r\nlevel.textNotify               # 文本通知\r\nlevel.virtualWorld             # 虚拟世界\r\nlevel.item                     # 物品\r\nlevel.neteaseWindow            # 网易窗口\r\n```\r\n\r\n## 绘图工具 (architect.utils.drawing)\r\n\r\n提供游戏内调试用的 3D 线条绘制功能：\r\n\r\n```python\r\nfrom architect.math.vec3 import vec, Vector3\r\nfrom architect.utils.drawing import drawLine, drawBox\r\n\r\n# 绘制一条线（起点，终点，颜色，持续时间）\r\ndrawLine(\r\n    vec((0, 0, 0)),\r\n    vec((10, 0, 0)),\r\n    vec((1, 0, 0)),  # 红色\r\n    duration=5       # 5秒后自动消失\r\n)\r\n\r\n# 绘制一个方体框（中心，尺寸，前方方向，颜色，持续时间）\r\ndrawBox(\r\n    vec((0, 5, 0)),      # 中心位置\r\n    vec((2, 2, 2)),      # 尺寸 (width, height, depth)\r\n    vec((1, 0, 0)),      # 前方方向\r\n    vec((1, 1, 0)),      # 黄色\r\n    duration=5\r\n)\r\n```\r\n\r\n## 客户端工具 (architect.utils.client)\r\n\r\n```python\r\nfrom architect.utils.client import isPlayer\r\n\r\n# 判断实体是否为玩家\r\nif isPlayer(entityId):\r\n    print('This is a player')\r\n```\r\n\r\n客户端子系统 `ClientUtilsSubsys` 自动注册了两个自定义事件监听器：\r\n- `PlayCustomAudio`：播放自定义音效\r\n- `StopCustomAudio`：停止自定义音效\r\n\r\n## 动画与效果\r\n\r\n### Molang\r\n\r\n```python\r\n# 客户端设置 Molang 变量\r\nfrom architect.utils.molang.client import setMolang, getMolang\r\n\r\nsetMolang(entityId, 'variable.my_var', 1.0)\r\nvalue = getMolang(entityId, 'variable.my_var')\r\n\r\n# 服务端设置 Molang 变量\r\nfrom architect.utils.molang.server import setMolang, getMolang\r\n```\r\n\r\n## 设备信息 (architect.utils.device)\r\n\r\n获取客户端运行环境信息：\r\n\r\n```python\r\nfrom architect.utils.device.client import *\r\n\r\n# 获取设备信息\r\ndeviceInfo = getDeviceInfo()\r\n```\r\n\r\n## 皮肤形象 (architect.utils.persona)\r\n\r\n```python\r\nfrom architect.utils.persona.client import *\r\nfrom architect.utils.persona.server import *\r\n\r\n# 客户端/服务端的皮肤形象信息\r\n```\r\n\r\n## 数据持久化 (architect.persistent)\r\n\r\n支持将组件数据同步至持久化存储。结合 `@Component(persist=True)` 使用：\r\n\r\n```python\r\nfrom architect.persistent.client import ClientKVDatabase, ClientKVDatabaseGlobal\r\nfrom architect.persistent.server import ServerKVDatabase\r\n\r\n# 服务端持久化数据库\r\ndb = ServerKVDatabase.getInstance()\r\ndb.setData('player_score', 100)\r\nscore = db.getData('player_score')\r\n\r\n# 客户端本地持久化数据库\r\nclientDb = ClientKVDatabase.getInstance()\r\nglobalDb = ClientKVDatabaseGlobal.getInstance()\r\n```\r\n\r\n## 工具集合 (architect.tools)\r\n\r\n```python\r\nfrom architect.tools import *\r\n\r\n# 代码生成工具\r\ngenerate_md_html  # Markdown → HTML 转换\r\ngenerate_lang     # 语言文件生成\r\n```\r\n\r\n## 不安全模块 (architect.core.unreliable)\r\n\r\n```python\r\nfrom architect.core.unreliable import Unreliable\r\n\r\n# 提供 try-call 封装，防止单个异常影响整体流程\r\nclass MyClass(Unreliable):\r\n    def risky_method(self):\r\n        raise Exception('Error')\r\n\r\nobj = MyClass()\r\nobj.tryCall(obj.risky_method)  # 不会抛出异常"}</script>
