<h1 id="architectref"><code>architect.ref</code> 模块</h1>
<p>资源与引用管理相关的工具集合，封装对共享资源的访问与引用计数逻辑。</p>
<p>源文件： <code>architect/ref.py</code></p>
<p>核心类型：</p>
<ul>
<li><code>Ref</code> — 简单的可变引用封装<ul>
<li>构造：<code>Ref(value)</code></li>
<li>属性：<code>value</code>（可读写）</li>
<li><code>isValid()</code> — 判断内部值是否非空</li>
</ul>
</li>
</ul>
<p>用途：<code>Ref</code> 常用于在事件或链式调用中传递可变的控制标志（例如中断事件流的布尔引用）。</p>
